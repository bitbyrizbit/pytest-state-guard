name: CI

on:
  push:
    branches: [main, "feat/*"]
  pull_request:
    branches: [main, "feat/*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-matrix:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run test suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: pytest -v

  min-pytest:
    name: test-minimum-pytest (py3.11, pytest 9.1.1)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies with pinned minimum pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==9.1.1
          python -m pip install -e .

      - name: Verify minimum pytest version
        run: pytest --version

      - name: Run test suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: pytest -v

  distribution-validation:
    name: distribution-validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build and packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distribution metadata with Twine
        run: python -m twine check dist/*

      - name: Verify py.typed in distribution archives
        run: |
          python -c '
          import glob
          import tarfile
          import zipfile
          import sys

          wheels = glob.glob("dist/*.whl")
          if not wheels:
              sys.exit("No wheel found in dist/")
          for whl in wheels:
              with zipfile.ZipFile(whl, "r") as z:
                  names = z.namelist()
                  if "pytest_state_guard/py.typed" not in names:
                      sys.exit(f"py.typed missing from wheel: {whl}")
              print(f"Verified py.typed present in wheel: {whl}")

          sdists = glob.glob("dist/*.tar.gz")
          if not sdists:
              sys.exit("No sdist found in dist/")
          for sdist in sdists:
              with tarfile.open(sdist, "r:gz") as t:
                  names = t.getnames()
                  if not any(n.endswith("src/pytest_state_guard/py.typed") for n in names):
                      sys.exit(f"py.typed missing from sdist: {sdist}")
              print(f"Verified py.typed present in sdist: {sdist}")
          '
