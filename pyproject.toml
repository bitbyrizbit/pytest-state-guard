[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-state-guard"
version = "0.1.0"
description = "Deterministic concurrency auditor for ThreadPoolExecutor task lifetimes against pytest owners"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "pytest-state-guard contributors" }
]
classifiers = [
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pytest>=9.1.1",
]

[project.urls]
Repository = "https://github.com/bitbyrizbit/pytest-state-guard"
Issues = "https://github.com/bitbyrizbit/pytest-state-guard/issues"

[project.entry-points.pytest11]
state_guard = "pytest_state_guard.plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pytest_state_guard = ["py.typed"]
