<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <!-- Container Squircle: Industrial Graphite -->
  <rect x="1" y="1" width="30" height="30" rx="7.0" fill="#0C1012" stroke="#1E262A" stroke-width="0.8"/>

  <!-- Setup Boundary: Solid, Squared-off Bracket (Warm Copper #B8734E) -->
  <path d="M 12.2 6.0
           L 5.8 6.0
           A 0.8 0.8 0 0 0 5.0 6.8
           L 5.0 25.2
           A 0.8 0.8 0 0 0 5.8 26.0
           L 12.2 26.0
           L 12.2 22.8
           L 8.4 22.8
           L 8.4 9.2
           L 12.2 9.2
           Z"
        fill="#B8734E"/>

  <!-- Teardown Boundary: Interrupted Bracket with Breach Aperture (Warm Ivory #D6C2A5) -->
  <!-- Upper Section -->
  <path d="M 16.2 6.0
           L 22.2 6.0
           A 1.2 1.2 0 0 1 23.4 7.2
           L 23.4 13.5
           L 20.0 13.5
           L 20.0 9.2
           L 16.2 9.2
           Z"
        fill="#D6C2A5"/>

  <!-- Lower Section -->
  <path d="M 20.0 18.5
           L 23.4 18.5
           L 23.4 24.8
           A 1.2 1.2 0 0 1 22.2 26.0
           L 16.2 26.0
           L 16.2 22.8
           L 20.0 22.8
           L 20.0 18.5
           Z"
        fill="#D6C2A5"/>

  <!-- Compliant Task 1 (Top): Thin, terminates safely at x=17.5 before teardown at x=20.0 -->
  <rect x="10.2" y="10.6" width="7.3" height="1.8" rx="0.9" fill="#B4A591"/>

  <!-- Compliant Task 2 (Bottom): Thin, terminates safely at x=17.0 before teardown at x=20.0 -->
  <rect x="10.2" y="19.6" width="6.8" height="1.8" rx="0.9" fill="#B4A591"/>

  <!-- Crossing Task: Pre-teardown Normal Execution Segment (Warm Ivory #F5F0E6) -->
  <path d="M 11.0 14.4
           L 21.7 14.4
           L 21.7 17.6
           L 11.0 17.6
           A 1.6 1.6 0 0 1 9.4 16.0
           A 1.6 1.6 0 0 1 11.0 14.4
           Z"
        fill="#F5F0E6"/>

  <!-- Crossing Task: Post-teardown BREACH Segment (Terracotta #E05A47) -->
  <path d="M 21.7 14.4
           L 26.2 14.4
           A 1.6 1.6 0 0 1 27.8 16.0
           A 1.6 1.6 0 0 1 26.2 17.6
           L 21.7 17.6
           Z"
        fill="#E05A47"/>

  <!-- State Guard Audit Sentinel: Positioned exactly at the boundary crossing (x=21.7, y=16.0) -->
  <circle cx="21.7" cy="16.0" r="2.6" fill="#FFFFFF"/>
  <circle cx="21.7" cy="16.0" r="1.3" fill="#E05A47"/>
</svg>